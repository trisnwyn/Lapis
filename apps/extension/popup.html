<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        background: #faf8f5;
        color: #1c1917;
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        margin: 0 0 12px;
      }
      .logo {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: #4f46e5;
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-style: italic;
        font-weight: 700;
      }
      #status {
        padding: 10px 12px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid #e7e2da;
        margin-bottom: 10px;
      }
      #status.ok {
        color: #047857;
        border-color: #a7f3d0;
        background: #ecfdf5;
      }
      #notes {
        font-size: 11px;
        color: #78716c;
        min-height: 15px;
        margin-bottom: 10px;
        word-break: break-all;
      }
      .row {
        display: flex;
        gap: 6px;
      }
      button {
        flex: 1;
        padding: 7px 4px;
        border: 1px solid #e7e2da;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover {
        border-color: #4f46e5;
        color: #4f46e5;
      }
      #hint {
        margin-top: 10px;
        font-size: 11px;
        color: #78716c;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1><span class="logo">L</span> Lapis — cầu nối LMS</h1>
    <div id="status">Đang tải…</div>
    <div id="notes"></div>
    <div class="row">
      <button id="capture">Chụp trang này</button>
      <button id="copy">Sao chép dữ liệu</button>
      <button id="clear">Xóa</button>
    </div>
    <div id="hint">Mở trang Lịch học trên LMS — extension tự bắt dữ liệu API khi trang tải lịch.</div>
    <script src="popup.js"></script>
  </body>
</html>
